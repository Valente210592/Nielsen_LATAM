<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="deerTan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="deerCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="goldAntler" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Sombra en la base -->
    <ellipse cx="60" cy="110" rx="38" ry="6" fill="#000000" opacity="0.1" />

    <!-- Ramita de café en el suelo -->
    <path d="M 20 108 Q 35 104 50 108" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 26 104 C 22 96 32 94 32 104 Z" fill="#22c55e" />
    <path d="M 38 105 C 38 97 48 97 44 105 Z" fill="#16a34a" />
    <!-- Cerezas de café -->
    <circle cx="22" cy="107" r="4" fill="#dc2626" />
    <circle cx="21" cy="106" r="1.2" fill="#ffffff" opacity="0.8" />
    <circle cx="30" cy="109" r="3.5" fill="#ef4444" />

    <!-- Colita blanca -->
    <path d="M 86 86 C 96 82 98 94 88 96 Z" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />

    <!-- Cuerpo sentado suave -->
    <ellipse cx="65" cy="88" rx="24" ry="18" fill="url(#deerTan)" />
    <!-- Pancita crema -->
    <ellipse cx="58" cy="90" rx="14" ry="12" fill="url(#deerCream)" />

    <!-- Patita delantera -->
    <rect x="46" y="88" width="7" height="18" rx="3.5" fill="url(#deerTan)" />
    <rect x="46" y="103" width="7" height="4" rx="1.5" fill="#78350f" />
    <rect x="58" y="88" width="7" height="18" rx="3.5" fill="url(#deerTan)" />
    <rect x="58" y="103" width="7" height="4" rx="1.5" fill="#78350f" />

    <!-- Manchitas blancas en lomo -->
    <circle cx="74" cy="80" r="2.2" fill="#ffffff" opacity="0.9" />
    <circle cx="81" cy="83" r="2.6" fill="#ffffff" opacity="0.9" />
    <circle cx="76" cy="88" r="2" fill="#ffffff" opacity="0.9" />

    <!-- Oreja Izquierda -->
    <g transform="translate(36, 32) rotate(-25)">
      <ellipse cx="8" cy="14" rx="7" ry="15" fill="url(#deerTan)" />
      <ellipse cx="8" cy="15" rx="4" ry="10" fill="#fbcfe8" />
    </g>

    <!-- Oreja Derecha -->
    <g transform="translate(68, 32) rotate(25)">
      <ellipse cx="8" cy="14" rx="7" ry="15" fill="url(#deerTan)" />
      <ellipse cx="8" cy="15" rx="4" ry="10" fill="#fbcfe8" />
    </g>

    <!-- Cuernitos dorados tiernos -->
    <path d="M 46 34 L 42 20 M 43 26 L 38 24" stroke="url(#goldAntler)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 74 34 L 78 20 M 77 26 L 82 24" stroke="url(#goldAntler)" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Cabeza redondita kawaii -->
    <circle cx="60" cy="54" r="22" fill="url(#deerTan)" />

    <!-- Zona de hocico / barbilla -->
    <ellipse cx="60" cy="62" rx="11" ry="8" fill="url(#deerCream)" />

    <!-- Nariz -->
    <ellipse cx="60" cy="58" rx="3.2" ry="2.2" fill="#1e1b4b" />
    <circle cx="59" cy="57.5" r="0.8" fill="#ffffff" />

    <!-- Ojos grandes tiernos -->
    <!-- Ojo izquierdo -->
    <circle cx="48" cy="49" r="4.5" fill="#1e1b4b" />
    <circle cx="46.5" cy="47.5" r="1.8" fill="#ffffff" />
    <circle cx="49.5" cy="51" r="0.8" fill="#ffffff" />
    <!-- Ojo derecho -->
    <circle cx="72" cy="49" r="4.5" fill="#1e1b4b" />
    <circle cx="70.5" cy="47.5" r="1.8" fill="#ffffff" />
    <circle cx="73.5" cy="51" r="0.8" fill="#ffffff" />

    <!-- Chapitas / Rubor en mejillas -->
    <ellipse cx="43" cy="57" rx="3.5" ry="2" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="77" cy="57" rx="3.5" ry="2" fill="#f43f5e" opacity="0.4" />

    <!-- Pestañas sutiles -->
    <path d="M 44 44 Q 48 42 51 45" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M 76 44 Q 72 42 69 45" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>
</svg>
